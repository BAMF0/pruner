[project]
name = "pruner"
version = "0.1.0"
description = "LLM-assisted pruning of a Launchpad bug backlog for a single source package"
readme = "README.md"
authors = [
    { name = "Simon Johnsson", email = "simon.johnsson@canonical.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "python-debian>=0.1.49",
]

[project.optional-dependencies]
# Only needed to actually write to Launchpad (`pruner apply` / `rollback`).
# Kept optional so the read/analyze path can be installed without OAuth deps.
write = [
    "launchpadlib>=1.11",
]

[project.scripts]
pruner = "pruner.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = ["debian.*", "launchpadlib.*", "lazr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
